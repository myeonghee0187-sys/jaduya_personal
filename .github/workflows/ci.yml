name: CI

# PR 을 올릴 때와 main 에 머지된 뒤 두 번 모두 돌린다.
# PR 단계에서 빨간불이 뜨면, 깨진 코드가 main 에 들어가는 것을 미리 막을 수 있다.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # package.json / package-lock.json 이 사라진 채로 머지되면 Vercel 배포가 통째로 깨진다.
      # (2026-09-09 실제 사고) setup-node 의 npm 캐시보다 먼저 확인해서 원인이 바로 보이게 한다.
      - name: 필수 패키지 파일 확인
        run: |
          missing=0
          for f in package.json package-lock.json; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::$f 이 없습니다. 이 파일이 없으면 Vercel 배포가 실패합니다. main 에서 복구한 뒤 다시 push 해주세요."
              missing=1
            fi
          done
          exit $missing

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # package.json 과 package-lock.json 이 어긋나 있으면 여기서 실패한다.
      # (npm install 과 달리 npm ci 는 lockfile 을 고쳐주지 않고 그대로 알려준다)
      - run: npm ci

      - run: npm run typecheck

      - run: npm run build
